<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer Static</title>
    <style>
        body {
            background-color: #333; /* Nền tối cho giống trình đọc PDF */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .gallery-container {
            width: 100%;
            max-width: 1068px; /* Khớp với FINAL_WIDTH của bạn */
            display: flex;
            flex-direction: column;
            gap: 15px; /* Khoảng cách giữa các trang */
        }
        
        .gallery-container img {
            width: 100%;
            height: auto;
            display: block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            /* Vô hiệu hóa việc tương tác chuột */
            pointer-events: none; 
            user-select: none;
        }

        h1 {
            color: white;
            font-family: sans-serif;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>Tài liệu nội bộ</h1>

    <div class="gallery-container" id="gallery">
        </div>

    <script>
        // Cấu hình số lượng ảnh thực tế của bạn
        const TOTAL_IMAGES = 33; 
        const FOLDER_NAME = 'ket_qua_anh';
        const galleryContainer = document.getElementById('gallery');

        for (let i = 1; i <= TOTAL_IMAGES; i++) {
            const fileNumber = i.toString().padStart(3, '0');
            const fileName = `output_${fileNumber}.jpg`;
            
            const img = document.createElement('img');
            img.src = `${FOLDER_NAME}/${fileName}`;
            img.alt = `Trang ${fileNumber}`;
            
            galleryContainer.appendChild(img);
        }
    </script>

</body>
</html>
