<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Image Gallery</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: var(--primary-color); margin-bottom: 30px; }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        
        .photo-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        
        .photo-card:hover {
            transform: translateY(-5px);
        }
        
        .photo-card img {
            width: 100%;
            height: auto;
            display: block;
            loading: lazy; /* Tối ưu hóa tốc độ load ảnh */
        }
        
        .photo-info {
            padding: 10px;
            text-align: center;
            font-size: 14px;
            color: #666;
            border-top: 1px solid #eee;
        }

        /* Responsive cho Mobile */
        @media (max-width: 600px) {
            .gallery { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <h1>Bộ sưu tập PDF đã tách</h1>

    <div class="gallery" id="gallery">
        </div>

    <script>
        // Cấu hình số lượng ảnh bạn đã tạo ra từ Python
        const TOTAL_IMAGES = 33; // Thay đổi con số này khớp với số file bạn có
        const FOLDER_NAME = 'ket_qua_anh'; // Tên thư mục chứa ảnh
        const galleryContainer = document.getElementById('gallery');

        for (let i = 1; i <= TOTAL_IMAGES; i++) {
            // Định dạng số thứ tự 001, 002... giống code Python
            const fileNumber = i.toString().padStart(3, '0');
            const fileName = `output_${fileNumber}.jpg`;
            const filePath = `${FOLDER_NAME}/${fileName}`;

            // Tạo cấu trúc HTML cho mỗi tấm ảnh
            const card = document.createElement('div');
            card.className = 'photo-card';
            
            card.innerHTML = `
                <a href="${filePath}" target="_blank">
                    <img src="${filePath}" alt="Trang ${fileNumber}">
                </a>
                <div class="photo-info">Trang ${fileNumber}</div>
            `;
            
            galleryContainer.appendChild(card);
        }
    </script>

</body>
</html>
